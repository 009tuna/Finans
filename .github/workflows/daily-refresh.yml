name: Günlük Piyasa Verisi Güncelleme

on:
  # Her hafta içi sabah 09:00 TR saati (UTC+3) = UTC 06:00
  schedule:
    - cron: '0 6 * * 1-5'

  # Manuel tetikleme (test için)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Piyasa Verilerini Çek ve Supabase'e Yaz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: finans-market-publication
      cancel-in-progress: false

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          # Node 22+ gerekli: @supabase/realtime-js eski Node'da native
          # WebSocket bulamazsa modül yüklenirken hata fırlatıyor (db.js createClient)
          node-version: '22'
          cache: 'npm'

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Veri yazmadan önce regresyon kontrolleri
        run: npm test

      - name: Piyasa verilerini çek
        run: node src/fetch-all.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FINNHUB_TOKEN:             ${{ secrets.FINNHUB_TOKEN }}

      - name: Bağımsız makro ve düzenleyici kaynakları yenile
        run: npm run intelligence
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Tahminleri çöz (prediction-resolver → Supabase/dosya)
        run: node src/prediction-resolver.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FINNHUB_TOKEN:             ${{ secrets.FINNHUB_TOKEN }}

      - name: Temel rapor taslağını üret (aktif araştırma korunur)
        run: node src/report.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FINNHUB_TOKEN:             ${{ secrets.FINNHUB_TOKEN }}

      - name: Araştırma tahminlerinin gerçekleşenlerini ölç
        run: node scripts/resolve-research.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_TOKEN:             ${{ secrets.FINNHUB_TOKEN }}

      - name: Kaynak kapsamı
        run: |
          node -e 'const b=require("./data/report/base.json");const lines=["## Finans veri akışı", "Çalışma: "+b.runId, "Veri: "+b.snapshotId, "Kalite: "+b.quality.status, "Fiyat kaynağı hataları: "+b.quality.snapshotErrors.length, ...Object.entries(b.calendar.coverage).map(([k,v])=>k+": "+v.status+" ("+v.count+")"), "AI: Bu workflow AI üretmez; kaynaklı analiz ayrı yayın adımını bekliyor."];require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n\n")+"\n");'
