name: Günlük Piyasa Verisi Güncelleme

on:
  # Her hafta içi sabah 09:00 TR saati (UTC+3) = UTC 06:00
  schedule:
    - cron: '0 6 * * 1-5'

  # Manuel tetikleme (test için)
  workflow_dispatch:

jobs:
  refresh:
    name: Piyasa Verilerini Çek ve Supabase'e Yaz
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          # Node 22+ gerekli: @supabase/realtime-js eski Node'da native
          # WebSocket bulamazsa modül yüklenirken hata fırlatıyor (db.js createClient)
          node-version: '22'
          cache: 'npm'

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Piyasa verilerini çek
        run: node src/fetch-all.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FINNHUB_TOKEN:             ${{ secrets.FINNHUB_TOKEN }}

      - name: Tahminleri çöz (prediction-resolver → Supabase/dosya)
        run: node src/prediction-resolver.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FINNHUB_TOKEN:             ${{ secrets.FINNHUB_TOKEN }}

      - name: Temel raporu üret (base → Supabase)
        run: node src/report.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FINNHUB_TOKEN:             ${{ secrets.FINNHUB_TOKEN }}

      - name: Günün ipucunu arşivle (tips-archive → Supabase/dosya)
        run: node scripts/archive-tip.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Tamamlandı
        run: echo "✅ Veriler + temel rapor + tahminler + arşiv güncellendi - $(date '+%Y-%m-%d %H:%M:%S UTC')"
